; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-wroom-32
src_dir = SRC/ShineWiFi-ModBus
extra_configs = 
	platformio-local.ini

[env]
monitor_speed = 115200
upload_speed = 921600
build_flags = 
	"-Wno-comment"
lib_deps = 
	ArduinoOTA
	knolleary/PubSubClient@^2.8
	tzapu/WiFiManager@^2.0.17
	khoih-prog/ESP_DoubleResetDetector@^1.3.2
	bblanchon/ArduinoJson@^7.4.2
	https://github.com/dirkx/tee-log.git#1.04
	https://github.com/OpenInverterGateway/ModbusMaster#16d5f1f1cb4e1c9a7943425557a09ac9e89d624c
	https://github.com/bblanchon/ArduinoStreamUtils#v1.7.3

[env:esp32-wroom-32]
platform = espressif32
board = upesy_wroom
framework = arduino
board_build.filesystem = littlefs
lib_deps = 
	${env.lib_deps}
	dvarrel/ESPping@^1.0.5
	tzapu/WiFiManager@^2.0.17
lib_ignore = LittleFS_esp32
build_flags = 
	${env.build_flags}

[env:ShineWifiX]
platform = espressif8266
board = esp07s
framework = arduino
lib_ldf_mode = deep+
lib_deps = 
	${env.lib_deps}
	vshymanskyy/Preferences@2.1.0
	bluemurder/ESP8266-ping@^2.0.1
	tzapu/WiFiManager@^2.0.17
build_flags = 
	${env.build_flags}
	"-D ENABLE_AP_BUTTON=1"

[env:ShineWifiS]
platform = espressif8266
board = esp12e
framework = arduino
lib_ldf_mode = deep+
lib_deps = 
	${env.lib_deps}
	vshymanskyy/Preferences@2.1.0
	bluemurder/ESP8266-ping@^2.0.1
	tzapu/WiFiManager@^2.0.17
build_flags = 
	${env.build_flags}
	"-D ENABLE_AP_BUTTON=1"

[env:d1]
platform = espressif8266
board = d1
framework = arduino
lib_ldf_mode = deep+
lib_deps = 
	${env.lib_deps}
	vshymanskyy/Preferences@2.1.0
	bluemurder/ESP8266-ping@^2.0.1
	tzapu/WiFiManager@^2.0.17
build_flags = 
	${env.build_flags}
	"-D ENABLE_AP_BUTTON=0"

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s2
framework = arduino
board_build.filesystem = littlefs
lib_deps = 
	${env.lib_deps}
	dvarrel/ESPping@^1.0.5
	tzapu/WiFiManager@^2.0.17
lib_ignore = LittleFS_esp32
build_flags = 
	${env.build_flags}

[env:ESP32-C3-suppermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    ${env.lib_deps}
    dvarrel/ESPping@^1.0.5
lib_ignore=LittleFS_esp32
build_flags =
    ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:lolin32]
platform = espressif32
board = lolin32
framework = arduino
board_build.filesystem = littlefs
lib_deps = 
	${env.lib_deps}
	dvarrel/ESPping@^1.0.5
	tzapu/WiFiManager@^2.0.17
lib_ignore = LittleFS_esp32
build_flags = 
	${env.build_flags}
